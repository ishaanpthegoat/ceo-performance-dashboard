name: Biweekly data sync

# Runs on the 1st and 15th of every month at 09:00 UTC — the biweekly cadence.
# Cron has no native "every two weeks", and `*/14` on day-of-month misbehaves at
# month boundaries (it would fire on the 1st, 15th and 29th, then reset), so
# naming the two days explicitly is the correct way to express this.
on:
  schedule:
    - cron: "0 9 1,15 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Limit the sync to one dataset"
        required: false
        default: ""
        type: choice
        options: ["", "financials", "prices"]

concurrency:
  group: data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Fetch filings and prices
        env:
          # SEC asks for a contact address in the User-Agent. Set the SEC_CONTACT
          # repository variable to your own; the script falls back to a default.
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            npm run sync -- --only=${{ inputs.only }}
          else
            npm run sync
          fi

      # A provider being down must not land an empty dataset. The sync script
      # already falls back to the committed copy, but this is the backstop: if
      # the result is missing or degenerate, fail the run and keep the old data.
      - name: Sanity-check the output
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const fin = JSON.parse(await readFile("public/data/financials.json", "utf8"));
            const px  = JSON.parse(await readFile("public/data/prices.json", "utf8"));
            const companies = Object.keys(fin.companies ?? {}).length;
            const symbols   = Object.keys(px.symbols ?? {}).length;
            const years = Object.values(fin.companies ?? {})
              .reduce((n, c) => n + (c.years?.length ?? 0), 0);
            console.log(`companies=${companies} symbols=${symbols} fiscal-year-rows=${years}`);
            if (companies < 12) throw new Error(`expected 12 companies, got ${companies}`);
            if (symbols < 13)   throw new Error(`expected 13 symbols, got ${symbols}`);
            if (years < 100)    throw new Error(`suspiciously few fiscal years: ${years}`);
            if (!px.symbols.benchmark?.monthly?.length) throw new Error("benchmark series is empty");
          '

      - name: Verify the app still builds against the new data
        run: npm run build

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(data): biweekly sync $(date -u +%Y-%m-%d)"

          # Rebase-and-retry rather than a bare push. If a manual dispatch
          # overlaps the scheduled run, the loser checked out before the winner
          # committed and its push is not a fast-forward. Regenerated data is
          # always safe to replay on top of whatever landed first — it is
          # derived output, not authored work — so rebasing cannot lose
          # anything.
          for attempt in 1 2 3; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main."
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

  # Redeploy the site with the new data. This has to be an explicit call: the
  # commit above is made with GITHUB_TOKEN, and GitHub does not fire workflow
  # triggers for GITHUB_TOKEN pushes (it is the loop guard). Relying on
  # pages.yml's `push` trigger would leave the published site stale forever.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
